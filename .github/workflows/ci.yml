name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download NLTK data
        run: python -c "import nltk; [nltk.download(r) for r in ('punkt','punkt_tab','stopwords')]"

      - name: Lint (syntax only, non-blocking)
        run: python -m compileall -q rag_qa scripts

      - name: Run tests
        # Skip the model-download integration test; it is exercised locally.
        run: python -m pytest --ignore=tests/test_embedding_integration.py
